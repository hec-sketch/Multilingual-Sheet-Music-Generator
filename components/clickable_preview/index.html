<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;font-family:system-ui,sans-serif}
#wrap{position:relative;display:block;width:100%}
#img{display:block;width:100%;height:auto}
.hot{position:absolute;box-sizing:border-box;border:1.5px solid transparent;border-radius:4px;background:rgba(255,255,255,0.01);cursor:text;padding:0}
.hot:hover{border-color:rgba(47,61,75,.65);background:rgba(255,255,255,.18)}
.hot.selected{border-color:#2f3d4b;background:rgba(169,179,156,.25)}
#editor{position:absolute;display:none;box-sizing:border-box;text-align:center;
  border:1.5px solid #2f3d4b;border-radius:3px;background:#fffef7;color:#2f3d4b;
  font-family:"Liberation Serif",Georgia,serif;padding:0 2px;outline:none;
  box-shadow:0 1px 6px rgba(47,61,75,.28)}
#tools{position:absolute;display:none;gap:2px;background:#2f3d4b;border-radius:4px;padding:2px}
#tools button{border:0;background:transparent;color:#f7f7f2;font-size:11px;line-height:1;
  padding:3px 5px;cursor:pointer;border-radius:3px;font-family:system-ui,sans-serif}
#tools button:hover{background:rgba(255,255,255,.18)}
/* A syllable typed but not yet drawn by the server: painted over the old one so
   the page reads correctly the instant Enter is pressed. */
.pend{position:absolute;transform:translate(-50%,-100%);white-space:pre;
  font-family:"Liberation Serif",Georgia,"Times New Roman",serif;color:#11722F;
  background:#F7F7F2;padding:0 2px;border-radius:2px;pointer-events:none}
.tip{position:absolute;left:6px;top:6px;padding:3px 7px;background:rgba(247,247,242,.92);
  border:1px solid #a9b39c;border-radius:6px;font-size:11px;color:#2f3d4b;pointer-events:none}
</style></head><body>
<div id="wrap">
  <img id="img" alt="">
  <div id="pending"></div>
  <div id="hotspots"></div>
  <input id="editor" spellcheck="false" autocomplete="off">
  <div id="tools">
    <button type="button" data-move="-1" title="Move left 1pt">◀</button>
    <button type="button" data-move="1" title="Move right 1pt">▶</button>
    <button type="button" data-move="-5" title="Move left 5pt">◀◀</button>
    <button type="button" data-move="5" title="Move right 5pt">▶▶</button>
    <button type="button" data-done="1" title="Keep as it is">leave as is</button>
  </div>
  <div class="tip">Click a syllable to type over it</div>
</div>
<script>
// The page is drawn at `zoom` times its PDF size and the browser then scales
// that image to whatever width the column gives us, so a hotspot has to follow
// both. Reading the image's own clientWidth is what keeps a click on the picture
// and a click on the hit area meaning the same syllable at any window size.
//
// Clicking a syllable opens an input sitting exactly on top of it, sized and
// centred like the syllable it replaces, so what is being typed is visible in
// place - the score is the form. Enter commits, Escape cancels.

var ARGS = null, ACTIVE = null, SEQ = 0, SHOWN = null, PENDING = {};

function post(msg) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true}, msg), "*");
}
function ready() { post({type: "streamlit:componentReady", apiVersion: 1}); }
function height() {
  post({type: "streamlit:setFrameHeight",
        height: Math.ceil(document.documentElement.scrollHeight)});
}
function send(payload) {
  SEQ += 1;
  post({type: "streamlit:setComponentValue", dataType: "json",
        value: Object.assign({seq: SEQ}, payload)});
}

function scale() {
  var img = document.getElementById("img");
  var natural = (ARGS && ARGS.width) || img.naturalWidth || 1;
  return ((ARGS && ARGS.zoom) || 1) * ((img.clientWidth || natural) / natural);
}

function closeEditor(commit) {
  var editor = document.getElementById("editor");
  var tools = document.getElementById("tools");
  var spot = ACTIVE;
  editor.style.display = "none";
  tools.style.display = "none";
  ACTIVE = null;
  if (!spot) return;
  var text = editor.value.trim();
  if (commit && text !== (spot.label === "(no syllable)" ? "" : spot.label)) {
    // Show the new syllable on the score straight away. Redrawing the page is
    // the server's job and takes a moment; waiting for it to come back before
    // anything changes on screen is what made typing here feel unlike typing.
    PENDING[spot.key] = text;
    paint();
    send({key: spot.key, voice: spot.voice, line_id: spot.line_id,
          index: spot.index, slot: spot.slot, action: "edit", text: text});
  }
}

function paint() {
  // Draw what has been typed but not yet come back from the server over the
  // syllable it replaces, so the page always shows the latest word.
  if (!ARGS) return;
  var host = document.getElementById("pending");
  var k = scale();
  var baseline = (ARGS.baseline === undefined ? 5.6 : ARGS.baseline);
  host.innerHTML = "";
  (ARGS.hotspots || []).forEach(function (h) {
    if (!(h.key in PENDING)) return;
    var patch = document.createElement("div");
    patch.className = "pend";
    patch.textContent = PENDING[h.key];
    patch.style.fontSize = ((h.size || 9.2) * k) + "px";
    patch.style.left = (h.x * k) + "px";
    patch.style.top = ((h.y + baseline) * k) + "px";
    host.appendChild(patch);
  });
}

function openEditor(spot, box) {
  closeEditor(false);
  ACTIVE = spot;
  var editor = document.getElementById("editor");
  var tools = document.getElementById("tools");
  var k = scale();
  var width = Math.max(34, parseFloat(box.style.width) + 14);
  editor.value = spot.label === "(no syllable)" ? "" : spot.label;
  editor.placeholder = spot.label === "(no syllable)" ? "no syllable" : "";
  editor.style.fontSize = Math.max(9, 11 * k) + "px";
  editor.style.height = Math.max(16, 20 * k) + "px";
  editor.style.width = width + "px";
  editor.style.left = (parseFloat(box.style.left) + parseFloat(box.style.width) / 2
                       - width / 2) + "px";
  editor.style.top = box.style.top;
  editor.style.display = "block";
  tools.style.left = editor.style.left;
  tools.style.top = (parseFloat(box.style.top) + parseFloat(editor.style.height) + 3) + "px";
  tools.style.display = "flex";
  editor.focus();
  editor.select();
  send({key: spot.key, voice: spot.voice, line_id: spot.line_id,
        index: spot.index, slot: spot.slot, action: "select"});
}

function place() {
  if (!ARGS) return;
  var host = document.getElementById("hotspots");
  var k = scale();
  var baseline = (ARGS.baseline === undefined ? 5.6 : ARGS.baseline);
  closeEditor(false);
  host.innerHTML = "";
  (ARGS.hotspots || []).forEach(function (h) {
    var b = document.createElement("button");
    b.className = "hot" + (ARGS.selected === h.key ? " selected" : "");
    b.title = h.label;
    b.type = "button";
    var w = Math.max(16, Math.min(64, (String(h.label || "").length * 6 + 12) * k));
    var hh = Math.max(14, 22 * k);
    b.style.left = (h.x * k - w / 2) + "px";
    b.style.top = ((h.y + baseline) * k - hh * 0.78) + "px";
    b.style.width = w + "px";
    b.style.height = hh + "px";
    b.onclick = function () { openEditor(h, b); };
    host.appendChild(b);
  });
  paint();
  height();
}

document.getElementById("editor").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); closeEditor(true); }
  else if (e.key === "Escape") { e.preventDefault(); closeEditor(false); }
});
document.getElementById("editor").addEventListener("blur", function () {
  // Losing focus to one of the nudge buttons must not close the editor.
  setTimeout(function () {
    if (!document.getElementById("tools").matches(":hover")) closeEditor(true);
  }, 120);
});
document.getElementById("tools").addEventListener("click", function (e) {
  var button = e.target.closest("button");
  if (!button || !ACTIVE) return;
  var spot = ACTIVE;
  if (button.dataset.move) {
    send({key: spot.key, voice: spot.voice, line_id: spot.line_id, index: spot.index,
          slot: spot.slot, action: "nudge", delta: parseFloat(button.dataset.move)});
    closeEditor(false);
  } else {
    send({key: spot.key, voice: spot.voice, line_id: spot.line_id, index: spot.index,
          slot: spot.slot, action: "keep"});
    closeEditor(false);
  }
});

function render(args) {
  ARGS = args || {};
  var img = document.getElementById("img");
  var src = "data:image/png;base64," + ARGS.image;
  if (ARGS.image !== SHOWN) {
    // A freshly drawn page has arrived, so everything typed before it was made
    // is now in the picture itself and no longer needs painting over the top.
    SHOWN = ARGS.image;
    PENDING = {};
    img.onload = place;
    img.src = src;
  }
  if (img.complete) place();
}

window.addEventListener("message", function (e) {
  var d = e.data || {};
  if (d.type === "streamlit:render") render(d.args || {});
});
window.addEventListener("resize", place);
if (window.ResizeObserver) {
  new ResizeObserver(place).observe(document.getElementById("wrap"));
}
ready();
</script></body></html>
